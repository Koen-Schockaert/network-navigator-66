name: Release

# Triggered by pushing a version tag, e.g.:
#   v1.2.0            -> stable release
#   v1.2.0-beta.1      -> beta (prerelease) channel
#   v1.2.0-alpha.1      -> alpha (prerelease) channel
# `npm run release:alpha` / `release:beta` / `release:patch` etc. (see package.json)
# bump the version and create+push the matching tag for you.
#
# Each platform job uploads its installers straight to the GitHub Release as
# release assets (not GitHub Actions build artifacts, which have a separate,
# much smaller storage quota that large Electron installers blow through).
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.channel.outputs.prerelease }}
    steps:
      - name: Determine channel
        id: channel
        run: |
          if [[ "${{ github.ref_name }}" == *-alpha* || "${{ github.ref_name }}" == *-beta* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ steps.channel.outputs.prerelease }}
          generate_release_notes: true

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: package:linux
            artifact-glob: |
              electron-release/*.AppImage
              electron-release/*.deb
          - os: windows-latest
            script: package:win
            artifact-glob: |
              electron-release/*.exe
          - os: macos-latest
            script: package:mac
            artifact-glob: |
              electron-release/*.dmg
              electron-release/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run ${{ matrix.script }}

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ matrix.artifact-glob }}

  # Multi-arch server image consumed both by plain `docker run`/docker-compose
  # deployments and by the Home Assistant add-on (netscan/config.yaml's
  # `image:` field references this same image — see netscan/README.md).
  docker:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/netscan" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          image="${{ steps.image.outputs.name }}"
          version="${GITHUB_REF_NAME#v}"
          tags="${image}:${version}"
          if [ "${{ needs.create-release.outputs.prerelease }}" = "false" ]; then
            tags="$(printf '%s\n%s' "$tags" "${image}:latest")"
          fi
          {
            echo "value<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.value }}
