name: CI

on:
  pull_request:
    branches: [main, beta, alpha]
  push:
    branches: [main, beta, alpha]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Build desktop SPA
        run: npm run build:app
